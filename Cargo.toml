[package]
name = "smug"
version = "1.0.0"
edition = "2021"
description = "Local-first memory for AI coding agents: Markdown notes, decisions with sources, stale-decision guard, change-impact preview and eval gate. One binary."
repository = "https://github.com/OnurByte/smugbrain"
homepage = "https://github.com/OnurByte/smugbrain"
readme = "README.md"
keywords = ["agent-memory", "markdown", "knowledge-management", "ai-agents", "cli"]
categories = ["command-line-utilities", "text-processing"]
license = "Unlicense"

[dependencies]
sha2 = "0.10"
regex = "1"
redb = "4.5.0"
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
