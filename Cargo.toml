[package]
name = "smug"
version = "0.2.0"
edition = "2021"
description = "smugBrain: plain-Markdown memory for agents. One binary."
license = "Unlicense"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
regex = "1"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
strip = true
