<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="What is it"><rect width="880" height="390" fill="#FFFFFF"/><rect x=".5" y=".5" width="879" height="389" fill="none" stroke="#DDD"/><circle cx="34" cy="30" r="9" fill="#111111"/><circle cx="34" cy="80" r="9" fill="#111111"/><circle cx="34" cy="130" r="9" fill="#111111"/><circle cx="34" cy="180" r="9" fill="#111111"/><circle cx="34" cy="230" r="9" fill="#111111"/><circle cx="34" cy="280" r="9" fill="#111111"/><circle cx="34" cy="330" r="9" fill="#111111"/><text x="100" y="46" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >What is it</text><text x="844" y="46" font-size="12" font-weight="300" fill="#111111" text-anchor="end" >SBH 1.0</text><text x="844" y="62" font-size="12" font-weight="300" fill="#111111" text-anchor="end" >November 2026</text><line x1="100" y1="84" x2="844" y2="84" stroke="#111111" stroke-width="1"/><text x="100" y="112" font-size="13" font-weight="300" fill="#111111" text-anchor="start" >Three verbs. That is the whole product.</text><text x="100" y="190" font-size="64" font-weight="700" fill="#D92B2F" text-anchor="start" >01</text><text x="100" y="228" font-size="22" font-weight="700" fill="#111111" text-anchor="start" >Write</text><line x1="100" y1="242" x2="325" y2="242" stroke="#111111"/><text x="100" y="266" font-size="13" font-weight="700" fill="#111111" text-anchor="start" >Your notes are plain text files</text><text x="100" y="284" font-size="13" font-weight="700" fill="#111111" text-anchor="start" >in a folder you choose.</text><text x="100" y="308" font-size="12" font-weight="300" fill="#8A877E" text-anchor="start" >Open them in any editor, Obsidian too.</text><text x="355" y="190" font-size="64" font-weight="700" fill="#D92B2F" text-anchor="start" >02</text><text x="355" y="228" font-size="22" font-weight="700" fill="#111111" text-anchor="start" >Remember</text><line x1="355" y1="242" x2="580" y2="242" stroke="#111111"/><text x="355" y="266" font-size="13" font-weight="700" fill="#111111" text-anchor="start" >Every AI session leaves</text><text x="355" y="284" font-size="13" font-weight="700" fill="#111111" text-anchor="start" >a short trail.</text><text x="355" y="308" font-size="12" font-weight="300" fill="#8A877E" text-anchor="start" >The next session picks it up.</text><text x="610" y="190" font-size="64" font-weight="700" fill="#D92B2F" text-anchor="start" >03</text><text x="610" y="228" font-size="22" font-weight="700" fill="#111111" text-anchor="start" >Recall</text><line x1="610" y1="242" x2="835" y2="242" stroke="#111111"/><text x="610" y="266" font-size="13" font-weight="700" fill="#111111" text-anchor="start" >Ask a question, get the</text><text x="610" y="284" font-size="13" font-weight="700" fill="#111111" text-anchor="start" >right note back.</text><text x="610" y="308" font-size="12" font-weight="300" fill="#8A877E" text-anchor="start" >Searches words and meaning.</text><text x="100" y="356" font-size="13" font-weight="700" fill="#111111" text-anchor="start" >No app to log into. Delete the tool and your notes are still there.</text><text x="844" y="372" font-size="12" font-weight="300" fill="#111111" text-anchor="end" >1.1</text></svg>
