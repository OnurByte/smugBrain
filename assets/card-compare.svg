aude Code, Codex, Antigravity), built-in semantic search,</text><text x="100" y="754" font-size="11" font-weight="700" fill="#111111" text-anchor="start" >and test volume (hafiza-os reports 360, avenoxbeyin 2,316; smug has 223). smug --deep hands semantic queries to QMD.</text><text x="844" y="792" font-size="12" font-weight="300" fill="#111111" text-anchor="end" >1.2</text></svg>
