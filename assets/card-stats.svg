<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 788" width="880" height="788" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="By the numbers"><rect width="880" height="788" fill="#FFFFFF"/><rect x=".5" y=".5" width="879" height="787" fill="none" stroke="#DDD"/><circle cx="34" cy="30" r="9" fill="#111111"/><circle cx="34" cy="80" r="9" fill="#111111"/><circle cx="34" cy="130" r="9" fill="#111111"/><circle cx="34" cy="180" r="9" fill="#111111"/><circle cx="34" cy="230" r="9" fill="#111111"/><circle cx="34" cy="280" r="9" fill="#111111"/><circle cx="34" cy="330" r="9" fill="#111111"/><circle cx="34" cy="380" r="9" fill="#111111"/><circle cx="34" cy="430" r="9" fill="#111111"/><circle cx="34" cy="480" r="9" fill="#111111"/><circle cx="34" cy="530" r="9" fill="#111111"/><circle cx="34" cy="580" r="9" fill="#111111"/><circle cx="34" cy="630" r="9" fill="#111111"/><circle cx="34" cy="680" r="9" fill="#111111"/><circle cx="34" cy="730" r="9" fill="#111111"/><circle cx="34" cy="780" r="9" fill="#111111"/><text x="100" y="46" font-size="15" font-weight="700" fill="#111111">By the numbers</text><text x="844" y="46" font-size="12" font-weight="300" fill="#111111" text-anchor="end">SBH 1.0</text><text x="844" y="62" font-size="12" font-weight="300" fill="#111111" text-anchor="end">November 2026</text><line x1="100" y1="84" x2="844" y2="84" stroke="#111111" stroke-width="1"/><text x="100" y="164" font-size="52" font-weight="700" fill="#D92B2F">100%</text><text x="330" y="138" font-size="15" font-weight="700" fill="#111111">of your notes are plain Markdown</text><text x="330" y="158" font-size="12.5" font-weight="300" fill="#8A877E">Open, copy, print, or leave any time. Nothing is locked in.</text><rect x="330" y="168" width="500" height="6" fill="#EEE"/><rect x="330" y="168" width="500" height="6" fill="#111111"/><line x1="100" y1="190" x2="844" y2="190" stroke="#DDD"/><text x="100" y="242" font-size="52" font-weight="700" fill="#D92B2F">0</text><text x="330" y="216" font-size="15" font-weight="700" fill="#111111">accounts, clouds or subscriptions</text><text x="330" y="236" font-size="12.5" font-weight="300" fill="#8A877E">Runs on your own machine and makes no network calls. Free, and yours.</text><line x1="100" y1="268" x2="844" y2="268" stroke="#DDD"/><text x="100" y="320" font-size="52" font-weight="700" fill="#D92B2F">8</text><text x="330" y="294" font-size="15" font-weight="700" fill="#111111">coding tools set up in one command</text><text x="330" y="314" font-size="12.5" font-weight="300" fill="#8A877E">Claude Code, Codex, Cursor, Gemini CLI, Windsurf, Kiro, VS Code, OpenCode.</text><line x1="100" y1="346" x2="844" y2="346" stroke="#DDD"/><text x="100" y="398" font-size="52" font-weight="700" fill="#D92B2F">5</text><text x="330" y="372" font-size="15" font-weight="700" fill="#111111">kinds of secret stopped before a backup</text><text x="330" y="392" font-size="12.5" font-weight="300" fill="#8A877E">Private keys, tokens, API keys, passwords, recovery phrases never get committed.</text><line x1="100" y1="424" x2="844" y2="424" stroke="#DDD"/><text x="100" y="476" font-size="52" font-weight="700" fill="#D92B2F">0</text><text x="330" y="450" font-size="15" font-weight="700" fill="#111111">files lost with 8 writers at once</text><text x="330" y="470" font-size="12.5" font-weight="300" fill="#8A877E">1 write accepted, 7 refused on hash conflict. Automated test.</text><line x1="100" y1="502" x2="844" y2="502" stroke="#DDD"/><text x="100" y="554" font-size="52" font-weight="700" fill="#D92B2F">443</text><text x="330" y="528" font-size="15" font-weight="700" fill="#111111">automated tests, all green</text><text x="330" y="548" font-size="12.5" font-weight="300" fill="#8A877E">Every bug we found got its own test. Linux, macOS, Windows in CI. FreeBSD, Haiku at release.</text><line x1="100" y1="580" x2="844" y2="580" stroke="#DDD"/><text x="100" y="632" font-size="52" font-weight="700" fill="#D92B2F">21 ms</text><text x="330" y="606" font-size="15" font-weight="700" fill="#111111">to search 2,000 notes</text><text x="330" y="626" font-size="12.5" font-weight="300" fill="#8A877E">Tantivy index, warm. First build 139 ms. Synthetic vault.</text><line x1="100" y1="658" x2="844" y2="658" stroke="#DDD"/><text x="100" y="710" font-size="52" font-weight="700" fill="#D92B2F">7 MB</text><text x="330" y="684" font-size="15" font-weight="700" fill="#111111">one binary, nothing else to install</text><text x="330" y="704" font-size="12.5" font-weight="300" fill="#8A877E">No Python. No Node. No C library. No server. No account.</text><text x="100" y="762" font-size="12" font-weight="300" fill="#8A877E">Speed, size and write safety measured 2026-11-12 with smug 1.1.0; test count at 1.1.3. Run them yourself: cargo test, smug bench.</text><text x="844" y="770" font-size="12" font-weight="300" fill="#111111" text-anchor="end">1.1</text></svg>
