<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="By the numbers"><rect width="880" height="490" fill="#FFFFFF"/><rect x=".5" y=".5" width="879" height="489" fill="none" stroke="#DDD"/><circle cx="34" cy="30" r="9" fill="#111111"/><circle cx="34" cy="80" r="9" fill="#111111"/><circle cx="34" cy="130" r="9" fill="#111111"/><circle cx="34" cy="180" r="9" fill="#111111"/><circle cx="34" cy="230" r="9" fill="#111111"/><circle cx="34" cy="280" r="9" fill="#111111"/><circle cx="34" cy="330" r="9" fill="#111111"/><circle cx="34" cy="380" r="9" fill="#111111"/><circle cx="34" cy="430" r="9" fill="#111111"/><text x="100" y="46" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >By the numbers</text><text x="844" y="46" font-size="12" font-weight="300" fill="#111111" text-anchor="end" >SBH 1.0</text><text x="844" y="62" font-size="12" font-weight="300" fill="#111111" text-anchor="end" >November 2026</text><line x1="100" y1="84" x2="844" y2="84" stroke="#111111" stroke-width="1"/><text x="100" y="164" font-size="52" font-weight="700" fill="#D92B2F" text-anchor="start" >100%</text><text x="290" y="138" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >of your notes are plain Markdown</text><text x="290" y="158" font-size="12.5" font-weight="300" fill="#8A877E" text-anchor="start" >Open, copy, print, or leave any time.</text><rect x="290" y="168" width="540" height="6" fill="#EEE"/><rect x="290" y="168" width="540" height="6" fill="#111111"/><line x1="100" y1="190" x2="844" y2="190" stroke="#DDD"/><text x="100" y="242" font-size="52" font-weight="700" fill="#D92B2F" text-anchor="start" >5/5</text><text x="290" y="216" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >built-in self-tests pass</text><text x="290" y="236" font-size="12.5" font-weight="300" fill="#8A877E" text-anchor="start" >Run  python3 .claude/scripts/selftest.py  on the reference vault.</text><rect x="290" y="246" width="540" height="6" fill="#EEE"/><rect x="290" y="246" width="540" height="6" fill="#111111"/><line x1="100" y1="268" x2="844" y2="268" stroke="#DDD"/><text x="100" y="320" font-size="52" font-weight="700" fill="#D92B2F" text-anchor="start" >5</text><text x="290" y="294" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >secret scanners run before every backup</text><text x="290" y="314" font-size="12.5" font-weight="300" fill="#8A877E" text-anchor="start" >Private keys, tokens, API keys, passwords, recovery phrases.</text><rect x="290" y="324" width="540" height="6" fill="#EEE"/><rect x="290" y="324" width="540" height="6" fill="#111111"/><line x1="100" y1="346" x2="844" y2="346" stroke="#DDD"/><text x="100" y="398" font-size="52" font-weight="700" fill="#111111" text-anchor="start" >0</text><text x="290" y="372" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >accounts or subscriptions needed</text><text x="290" y="392" font-size="12.5" font-weight="300" fill="#8A877E" text-anchor="start" >Nothing to sign up for. Nothing to cancel.</text><rect x="290" y="402" width="540" height="6" fill="#EEE"/><rect x="290" y="402" width="0" height="6" fill="#111111"/><text x="100" y="460" font-size="12" font-weight="300" fill="#8A877E" text-anchor="start" >Measured on the author's reference vault, 2026-11-12. Re-run the commands yourself.</text><text x="844" y="472" font-size="12" font-weight="300" fill="#111111" text-anchor="end" >1.2</text></svg>
